<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="50%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c68642"/>
      <stop offset="100%" stop-color="#a8682a"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow-avatar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with Gradient -->
  <circle cx="200" cy="200" r="195" fill="url(#avatar-bg)" stroke="#312e81" stroke-width="3"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#neon-glow)" stroke-width="2" stroke-dasharray="12, 6" opacity="0.6"/>

  <!-- Subtle Matrix/Circuit Elements -->
  <g stroke="#6366f1" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="50" y1="120" x2="100" y2="120"/>
    <line x1="100" y1="120" x2="120" y2="100"/>
    <circle cx="50" cy="120" r="3" fill="#6366f1" fill-opacity="0.3"/>

    <line x1="350" y1="280" x2="300" y2="280"/>
    <line x1="300" y1="280" x2="280" y2="300"/>
    <circle cx="350" cy="280" r="3" fill="#8b5cf6" fill-opacity="0.3"/>
  </g>

  <!-- Developer Figure -->
  <g transform="translate(0, 20)">
    <!-- Hoodie / Shoulders -->
    <path d="M70 340 C90 270 130 240 200 240 C270 240 310 270 330 340 Z" fill="url(#hoodie)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4"/>
    <path d="M150 250 L200 310 L250 250 Z" fill="#0f172a" opacity="0.8"/>
    
    <!-- Neck -->
    <rect x="180" y="200" width="40" height="45" rx="6" fill="url(#skin)"/>
    
    <!-- Head / Face -->
    <ellipse cx="200" cy="165" rx="48" ry="58" fill="url(#skin)"/>
    
    <!-- Hair -->
    <path d="M148 150 C145 100 170 85 200 85 C230 85 255 100 252 150 C242 120 225 110 200 110 C175 110 158 120 148 150 Z" fill="#18181b"/>
    <path d="M148 140 C155 105 180 92 205 92 C235 92 250 110 252 135 C240 100 215 96 195 98 C175 100 160 115 148 140 Z" fill="#27272a"/>

    <!-- Ears -->
    <circle cx="150" cy="165" r="10" fill="url(#skin)"/>
    <circle cx="250" cy="165" r="10" fill="url(#skin)"/>

    <!-- Modern Glasses -->
    <rect x="160" y="150" width="34" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="3" filter="url(#glow-avatar)"/>
    <rect x="206" y="150" width="34" height="24" rx="6" fill="none" stroke="#6366f1" stroke-width="3" filter="url(#glow-avatar)"/>
    <line x1="194" y1="160" x2="206" y2="160" stroke="#6366f1" stroke-width="3"/>
    <!-- Glass Reflections -->
    <line x1="165" y1="154" x2="185" y2="168" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="211" y1="154" x2="231" y2="168" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Eyes -->
    <circle cx="177" cy="162" r="4" fill="#0f172a"/>
    <circle cx="223" cy="162" r="4" fill="#0f172a"/>
    <circle cx="179" cy="160" r="1.5" fill="#ffffff"/>
    <circle cx="225" cy="160" r="1.5" fill="#ffffff"/>

    <!-- Nose & Smile -->
    <path d="M198 174 L196 186 L204 186" fill="none" stroke="#8c511d" stroke-width="2" stroke-linecap="round"/>
    <path d="M188 198 Q200 206 212 198" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Modern Coding Headphones -->
    <path d="M142 165 C135 165 135 130 155 105 C175 80 225 80 245 105 C265 130 265 165 258 165" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <rect x="136" y="145" width="12" height="34" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="252" y="145" width="12" height="34" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Glowing Code Badge / Tag at bottom -->
  <g transform="translate(110, 345)">
    <rect width="180" height="34" rx="17" fill="#090d16" stroke="url(#neon-glow)" stroke-width="1.5" filter="url(#glow-avatar)"/>
    <circle cx="24" cy="17" r="4" fill="#10b981"/>
    <text x="36" y="22" fill="#e0e7ff" font-family="monospace" font-size="12" font-weight="700">&lt;SAI_DEV /&gt;</text>
    <text x="138" y="21" fill="#818cf8" font-family="monospace" font-size="11">AI • FS</text>
  </g>
</svg>
