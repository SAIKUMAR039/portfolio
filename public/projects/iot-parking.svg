<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg-grad-iot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0b121e"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card-grad-iot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0c101a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow-iot" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-iot" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad-iot)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="180" r="200" fill="#06b6d4" opacity="0.07" filter="url(#glow-iot)"/>
  <circle cx="1060" cy="540" r="240" fill="#3b82f6" opacity="0.08" filter="url(#glow-iot)"/>

  <!-- Top Navigation Bar -->
  <rect x="40" y="32" width="1200" height="64" rx="14" fill="#0f1623" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow-iot)"/>
  
  <!-- Brand -->
  <rect x="64" y="48" width="32" height="32" rx="8" fill="url(#cyan-grad)"/>
  <circle cx="80" cy="64" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="80" cy="64" r="3" fill="#ffffff"/>
  
  <text x="110" y="69" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16">IoT Smart Parking Control System</text>
  <rect x="400" y="52" width="140" height="24" rx="12" fill="#082f49" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="414" cy="64" r="4" fill="#38bdf8"/>
  <text x="426" y="68" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="600">MQTT BROKER ONLINE</text>

  <!-- Hardware Chip Tag -->
  <text x="940" y="69" fill="#94a3b8" font-family="monospace" font-size="12">ESP32 / Arduino Microcontroller • 12ms</text>
  <rect x="1170" y="52" width="50" height="24" rx="6" fill="#14532d"/>
  <text x="1182" y="68" fill="#86efac" font-family="monospace" font-size="11" font-weight="700">99.8%</text>

  <!-- Main Left: Interactive Parking Bay Map -->
  <g transform="translate(40, 116)">
    <rect width="780" height="572" rx="16" fill="url(#card-grad-iot)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow-iot)"/>
    
    <!-- Title & Mode -->
    <text x="32" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="18">Facility Parking Grid — Floor 01 (Zone Alpha)</text>
    <text x="32" y="58" fill="#64748b" font-family="monospace" font-size="12">// Sensor Cluster: Ultrasonic HC-SR04 &amp; IR Arrays</text>

    <!-- Legend -->
    <g transform="translate(540, 24)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      <circle cx="10" cy="12" r="5" fill="#10b981"/>
      <text x="22" y="16" fill="#cbd5e1">Vacant (Available)</text>
      <circle cx="120" cy="12" r="5" fill="#f43f5e"/>
      <text x="132" y="16" fill="#cbd5e1">Occupied</text>
    </g>

    <!-- Road / Driveway Line -->
    <rect x="32" y="240" width="716" height="88" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1"/>
    <!-- Road Lane Dashes -->
    <line x1="60" y1="284" x2="720" y2="284" stroke="#334155" stroke-width="2" stroke-dasharray="16, 16"/>
    <text x="390" y="289" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">◀ MAIN DRIVEWAY LANE ▶</text>

    <!-- Row A (Top Parking Bays: 5 slots) -->
    <g transform="translate(32, 90)">
      <!-- Bay A1 (Occupied) -->
      <g transform="translate(0, 0)">
        <rect width="132" height="136" rx="10" fill="#1e131d" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="16" y="24" fill="#fda4af" font-family="monospace" font-size="12" font-weight="700">BAY A-01</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#881337"/>
        <text x="86" y="25" fill="#fecdd3" font-family="monospace" font-size="9" font-weight="700">OCCUPIED</text>
        <!-- Car Silhouette -->
        <rect x="24" y="44" width="84" height="66" rx="10" fill="#be123c" opacity="0.6"/>
        <circle cx="36" cy="116" r="6" fill="#4c0519"/>
        <circle cx="96" cy="116" r="6" fill="#4c0519"/>
        <text x="16" y="128" fill="#f43f5e" font-family="monospace" font-size="10">Dist: 14cm</text>
      </g>

      <!-- Bay A2 (Vacant) -->
      <g transform="translate(146, 0)">
        <rect width="132" height="136" rx="10" fill="#0c1f19" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">BAY A-02</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#064e3b"/>
        <text x="89" y="25" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">VACANT</text>
        <text x="66" y="80" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="28" text-anchor="middle">OPEN</text>
        <text x="16" y="128" fill="#34d399" font-family="monospace" font-size="10">Dist: 280cm (Clear)</text>
      </g>

      <!-- Bay A3 (Occupied) -->
      <g transform="translate(292, 0)">
        <rect width="132" height="136" rx="10" fill="#1e131d" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="16" y="24" fill="#fda4af" font-family="monospace" font-size="12" font-weight="700">BAY A-03</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#881337"/>
        <text x="86" y="25" fill="#fecdd3" font-family="monospace" font-size="9" font-weight="700">OCCUPIED</text>
        <rect x="24" y="44" width="84" height="66" rx="10" fill="#be123c" opacity="0.6"/>
        <circle cx="36" cy="116" r="6" fill="#4c0519"/>
        <circle cx="96" cy="116" r="6" fill="#4c0519"/>
        <text x="16" y="128" fill="#f43f5e" font-family="monospace" font-size="10">Dist: 18cm</text>
      </g>

      <!-- Bay A4 (Vacant) -->
      <g transform="translate(438, 0)">
        <rect width="132" height="136" rx="10" fill="#0c1f19" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">BAY A-04</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#064e3b"/>
        <text x="89" y="25" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">VACANT</text>
        <text x="66" y="80" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="28" text-anchor="middle">OPEN</text>
        <text x="16" y="128" fill="#34d399" font-family="monospace" font-size="10">Dist: 275cm (Clear)</text>
      </g>

      <!-- Bay A5 (Occupied) -->
      <g transform="translate(584, 0)">
        <rect width="132" height="136" rx="10" fill="#1e131d" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="16" y="24" fill="#fda4af" font-family="monospace" font-size="12" font-weight="700">BAY A-05</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#881337"/>
        <text x="86" y="25" fill="#fecdd3" font-family="monospace" font-size="9" font-weight="700">OCCUPIED</text>
        <rect x="24" y="44" width="84" height="66" rx="10" fill="#be123c" opacity="0.6"/>
        <circle cx="36" cy="116" r="6" fill="#4c0519"/>
        <circle cx="96" cy="116" r="6" fill="#4c0519"/>
        <text x="16" y="128" fill="#f43f5e" font-family="monospace" font-size="10">Dist: 21cm</text>
      </g>
    </g>

    <!-- Row B (Bottom Parking Bays: 5 slots) -->
    <g transform="translate(32, 344)">
      <!-- Bay B1 (Vacant) -->
      <g transform="translate(0, 0)">
        <rect width="132" height="136" rx="10" fill="#0c1f19" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">BAY B-01</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#064e3b"/>
        <text x="89" y="25" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">VACANT</text>
        <text x="66" y="80" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="28" text-anchor="middle">OPEN</text>
        <text x="16" y="128" fill="#34d399" font-family="monospace" font-size="10">Dist: 290cm (Clear)</text>
      </g>

      <!-- Bay B2 (Occupied) -->
      <g transform="translate(146, 0)">
        <rect width="132" height="136" rx="10" fill="#1e131d" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="16" y="24" fill="#fda4af" font-family="monospace" font-size="12" font-weight="700">BAY B-02</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#881337"/>
        <text x="86" y="25" fill="#fecdd3" font-family="monospace" font-size="9" font-weight="700">OCCUPIED</text>
        <rect x="24" y="44" width="84" height="66" rx="10" fill="#be123c" opacity="0.6"/>
        <circle cx="36" cy="116" r="6" fill="#4c0519"/>
        <circle cx="96" cy="116" r="6" fill="#4c0519"/>
        <text x="16" y="128" fill="#f43f5e" font-family="monospace" font-size="10">Dist: 12cm</text>
      </g>

      <!-- Bay B3 (Vacant) -->
      <g transform="translate(292, 0)">
        <rect width="132" height="136" rx="10" fill="#0c1f19" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">BAY B-03</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#064e3b"/>
        <text x="89" y="25" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">VACANT</text>
        <text x="66" y="80" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="28" text-anchor="middle">OPEN</text>
        <text x="16" y="128" fill="#34d399" font-family="monospace" font-size="10">Dist: 285cm (Clear)</text>
      </g>

      <!-- Bay B4 (Occupied) -->
      <g transform="translate(438, 0)">
        <rect width="132" height="136" rx="10" fill="#1e131d" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="16" y="24" fill="#fda4af" font-family="monospace" font-size="12" font-weight="700">BAY B-04</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#881337"/>
        <text x="86" y="25" fill="#fecdd3" font-family="monospace" font-size="9" font-weight="700">OCCUPIED</text>
        <rect x="24" y="44" width="84" height="66" rx="10" fill="#be123c" opacity="0.6"/>
        <circle cx="36" cy="116" r="6" fill="#4c0519"/>
        <circle cx="96" cy="116" r="6" fill="#4c0519"/>
        <text x="16" y="128" fill="#f43f5e" font-family="monospace" font-size="10">Dist: 15cm</text>
      </g>

      <!-- Bay B5 (Vacant) -->
      <g transform="translate(584, 0)">
        <rect width="132" height="136" rx="10" fill="#0c1f19" stroke="#10b981" stroke-width="1.5"/>
        <text x="16" y="24" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="700">BAY B-05</text>
        <rect x="80" y="12" width="42" height="18" rx="4" fill="#064e3b"/>
        <text x="89" y="25" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">VACANT</text>
        <text x="66" y="80" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="28" text-anchor="middle">OPEN</text>
        <text x="16" y="128" fill="#34d399" font-family="monospace" font-size="10">Dist: 280cm (Clear)</text>
      </g>
    </g>

    <!-- Bottom Telemetry Status Line -->
    <rect x="32" y="504" width="716" height="42" rx="8" fill="#0b1019" stroke="#1e293b" stroke-width="1"/>
    <circle cx="52" cy="525" r="4" fill="#38bdf8"/>
    <text x="66" y="529" fill="#94a3b8" font-family="monospace" font-size="12">Telemetry Stream: Serial Baud 115200 • Refresh: 100ms • Packet Loss: 0.00%</text>
  </g>

  <!-- Right Column: Live Analytics & Hardware Telemetry -->
  <g transform="translate(840, 116)">
    <!-- Metrics Card -->
    <rect width="400" height="572" rx="16" fill="url(#card-grad-iot)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow-iot)"/>
    
    <text x="28" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="18">Real-Time Occupancy</text>
    <text x="28" y="58" fill="#64748b" font-family="monospace" font-size="12">Automated Barrier &amp; Sensor Engine</text>

    <!-- Circular Stat Ring / Progress Gauge -->
    <g transform="translate(28, 80)">
      <rect width="344" height="110" rx="12" fill="#090d15" stroke="#1e293b" stroke-width="1"/>
      
      <circle cx="64" cy="55" r="38" fill="none" stroke="#1e293b" stroke-width="8"/>
      <circle cx="64" cy="55" r="38" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="238" stroke-dashoffset="95"/>
      <text x="64" y="61" fill="#ffffff" font-family="monospace" font-size="16" font-weight="800" text-anchor="middle">60%</text>

      <text x="124" y="44" fill="#64748b" font-family="monospace" font-size="11">SLOT BREAKDOWN</text>
      <text x="124" y="68" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">6 Vacant <tspan fill="#64748b" font-size="14">/ 10 Total</tspan></text>
      <text x="124" y="88" fill="#10b981" font-family="monospace" font-size="11">● 4 Occupied Bays</text>
    </g>

    <!-- Hardware Diagnostics Section -->
    <text x="28" y="226" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-weight="600" font-size="14">Hardware &amp; Microcontroller Stack</text>

    <g transform="translate(28, 242)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="344" height="52" rx="10" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="600">ESP32 Wi-Fi / MCU</text>
      <text x="16" y="40" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">NodeMCU firmware v2.4 (Active)</text>
      <rect x="270" y="16" width="60" height="20" rx="4" fill="#14532d"/>
      <text x="280" y="30" fill="#86efac" font-family="monospace" font-size="10" font-weight="700">ONLINE</text>

      <!-- Item 2 -->
      <rect x="0" y="62" width="344" height="52" rx="10" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="86" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="600">HC-SR04 Ultrasonic</text>
      <text x="16" y="102" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">10 Sensors Polling Rate 100ms</text>
      <rect x="270" y="78" width="60" height="20" rx="4" fill="#14532d"/>
      <text x="280" y="92" fill="#86efac" font-family="monospace" font-size="10" font-weight="700">HEALTHY</text>

      <!-- Item 3 -->
      <rect x="0" y="124" width="344" height="52" rx="10" fill="#090e18" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="148" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="600">Automated Servo Gate</text>
      <text x="16" y="164" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">SG90 Micro Servo Barrier Control</text>
      <rect x="270" y="140" width="60" height="20" rx="4" fill="#14532d"/>
      <text x="283" y="154" fill="#86efac" font-family="monospace" font-size="10" font-weight="700">READY</text>
    </g>

    <!-- Embedded Code Snippet Card -->
    <rect x="28" y="440" width="344" height="106" rx="10" fill="#060910" stroke="#1e293b" stroke-width="1"/>
    <text x="42" y="462" fill="#38bdf8" font-family="monospace" font-size="10">// Arduino C++ Distance Computation</text>
    <text x="42" y="480" fill="#cbd5e1" font-family="monospace" font-size="11">digitalWrite(trigPin, HIGH);</text>
    <text x="42" y="498" fill="#cbd5e1" font-family="monospace" font-size="11">long duration = pulseIn(echoPin, HIGH);</text>
    <text x="42" y="516" fill="#34d399" font-family="monospace" font-size="11">distance = (duration * 0.0343) / 2;</text>
    <text x="42" y="534" fill="#64748b" font-family="monospace" font-size="10">// Slot state synced via MQTT</text>
  </g>
</svg>
