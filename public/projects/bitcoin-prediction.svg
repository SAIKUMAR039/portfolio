<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="btc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d16"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>
    <linearGradient id="btc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#btc-bg)"/>
  <!-- Top bar -->
  <rect x="40" y="30" width="1200" height="60" rx="12" fill="#111320" stroke="#1f2337" stroke-width="1.5"/>
  <text x="65" y="66" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="18">₿ BTC/USDT ML Predictive Terminal</text>
  <rect x="360" y="44" width="110" height="28" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="372" y="63" fill="#fcd34d" font-family="monospace" font-size="11">TENSORFLOW</text>
  <text x="750" y="66" fill="#94a3b8" font-family="monospace" font-size="13">SPOT: <tspan fill="#ffffff" font-weight="700">$64,820.50</tspan></text>
  <text x="960" y="66" fill="#94a3b8" font-family="monospace" font-size="13">ML 24H TARGET: <tspan fill="#10b981" font-weight="700">$67,450.00 (+4.05%)</tspan></text>
  <!-- Main Candlestick & Prediction Chart -->
  <g transform="translate(40, 110)">
    <rect width="840" height="570" rx="16" fill="#0d0f1a" stroke="#1e2236" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">LSTM Deep Learning Regression &amp; Confidence Bands</text>
    <text x="30" y="62" fill="#64748b" font-family="monospace" font-size="11">// Epoch 120/150 • Loss (MSE): 0.0018 • R² Score: 0.941</text>
    <!-- Grid lines -->
    <line x1="40" y1="120" x2="800" y2="120" stroke="#171b2d" stroke-width="1"/>
    <line x1="40" y1="220" x2="800" y2="220" stroke="#171b2d" stroke-width="1"/>
    <line x1="40" y1="320" x2="800" y2="320" stroke="#171b2d" stroke-width="1"/>
    <line x1="40" y1="420" x2="800" y2="420" stroke="#171b2d" stroke-width="1"/>
    <!-- Candlesticks (Historical) -->
    <!-- Candle 1 (Green) -->
    <line x1="80" y1="360" x2="80" y2="440" stroke="#10b981" stroke-width="2"/>
    <rect x="70" y="380" width="20" height="40" fill="#10b981"/>
    <!-- Candle 2 (Green) -->
    <line x1="130" y1="340" x2="130" y2="410" stroke="#10b981" stroke-width="2"/>
    <rect x="120" y="350" width="20" height="50" fill="#10b981"/>
    <!-- Candle 3 (Red) -->
    <line x1="180" y1="330" x2="180" y2="420" stroke="#ef4444" stroke-width="2"/>
    <rect x="170" y="360" width="20" height="35" fill="#ef4444"/>
    <!-- Candle 4 (Green) -->
    <line x1="230" y1="300" x2="230" y2="380" stroke="#10b981" stroke-width="2"/>
    <rect x="220" y="310" width="20" height="60" fill="#10b981"/>
    <!-- Candle 5 (Green) -->
    <line x1="280" y1="260" x2="280" y2="340" stroke="#10b981" stroke-width="2"/>
    <rect x="270" y="270" width="20" height="55" fill="#10b981"/>
    <!-- Candle 6 (Red) -->
    <line x1="330" y1="250" x2="330" y2="330" stroke="#ef4444" stroke-width="2"/>
    <rect x="320" y="280" width="20" height="30" fill="#ef4444"/>
    <!-- Candle 7 (Green) -->
    <line x1="380" y1="220" x2="380" y2="300" stroke="#10b981" stroke-width="2"/>
    <rect x="370" y="230" width="20" height="50" fill="#10b981"/>
    <!-- Candle 8 (Green - Current) -->
    <line x1="430" y1="190" x2="430" y2="270" stroke="#10b981" stroke-width="2"/>
    <rect x="420" y="200" width="20" height="55" fill="#10b981"/>
    <!-- Divider: Now (Live inference boundary) -->
    <line x1="450" y1="90" x2="450" y2="500" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="455" y="110" fill="#a5b4fc" font-family="monospace" font-size="11">MODEL FORECAST ➔</text>
    <!-- Confidence Band Fill -->
    <polygon points="450,200 550,160 650,130 750,100 750,180 650,220 550,240 450,200" fill="#6366f1" fill-opacity="0.12"/>
    <!-- Predicted Trajectory Line -->
    <path d="M430 200 Q 550 160 650 140 T 780 110" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="780" cy="110" r="7" fill="#f59e0b"/>
    <text x="700" y="90" fill="#fcd34d" font-family="monospace" font-size="13" font-weight="700">$67,450 TARGET</text>
    <!-- Bottom Time Axis -->
    <text x="80" y="530" fill="#64748b" font-family="monospace" font-size="11">04:00</text>
    <text x="230" y="530" fill="#64748b" font-family="monospace" font-size="11">10:00</text>
    <text x="430" y="530" fill="#a5b4fc" font-family="monospace" font-size="11">NOW (16:00)</text>
    <text x="630" y="530" fill="#f59e0b" font-family="monospace" font-size="11">+12H (04:00)</text>
    <text x="780" y="530" fill="#f59e0b" font-family="monospace" font-size="11">+24H (16:00)</text>
  </g>
  <!-- Right Column: Model Metrics & Feature Weights -->
  <g transform="translate(900, 110)">
    <rect width="340" height="570" rx="16" fill="#0d0f1a" stroke="#1e2236" stroke-width="1.5"/>
    <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Neural Network Signals</text>
    <!-- Feature Weights -->
    <g transform="translate(25, 60)">
      <text x="0" y="20" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">200 EMA Cross</text>
      <rect x="0" y="28" width="290" height="8" rx="4" fill="#1e2236"/>
      <rect x="0" y="28" width="240" height="8" rx="4" fill="#10b981"/>
      <text x="250" y="20" fill="#34d399" font-family="monospace" font-size="11">BULLISH (82%)</text>

      <text x="0" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">RSI 14 (Momentum)</text>
      <rect x="0" y="78" width="290" height="8" rx="4" fill="#1e2236"/>
      <rect x="0" y="78" width="180" height="8" rx="4" fill="#38bdf8"/>
      <text x="250" y="70" fill="#38bdf8" font-family="monospace" font-size="11">NEUTRAL (58)</text>

      <text x="0" y="120" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">On-Chain Exchange Outflow</text>
      <rect x="0" y="128" width="290" height="8" rx="4" fill="#1e2236"/>
      <rect x="0" y="128" width="260" height="8" rx="4" fill="#f59e0b"/>
      <text x="250" y="120" fill="#fbbf24" font-family="monospace" font-size="11">HIGH (89%)</text>
    </g>
    <!-- Model Architecture Specs -->
    <rect x="25" y="230" width="290" height="150" rx="10" fill="#121524"/>
    <text x="40" y="260" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="700">ARCHITECTURE: LSTM / GRU</text>
    <text x="40" y="285" fill="#94a3b8" font-family="monospace" font-size="11">Input Sequence: 60 timesteps</text>
    <text x="40" y="305" fill="#94a3b8" font-family="monospace" font-size="11">Hidden Units: 128 / 64 / 32</text>
    <text x="40" y="325" fill="#94a3b8" font-family="monospace" font-size="11">Dropout: 0.2 • Adam Optimizer</text>
    <text x="40" y="345" fill="#34d399" font-family="monospace" font-size="11">Validation Accuracy: 93.8%</text>
    <!-- Model Code Snippet -->
    <rect x="25" y="400" width="290" height="145" rx="10" fill="#070912" stroke="#1f2337" stroke-width="1"/>
    <text x="38" y="425" fill="#f59e0b" font-family="monospace" font-size="11"># Model Inference</text>
    <text x="38" y="445" fill="#e2e8f0" font-family="monospace" font-size="11">pred = model.predict(X_test)</text>
    <text x="38" y="465" fill="#38bdf8" font-family="monospace" font-size="11">inv_pred = scaler.inverse(pred)</text>
    <text x="38" y="485" fill="#10b981" font-family="monospace" font-size="11">signal = compute_alpha(inv_pred)</text>
    <text x="38" y="515" fill="#64748b" font-family="monospace" font-size="10">// Real-time Streamlit pipeline</text>
  </g>
</svg>
